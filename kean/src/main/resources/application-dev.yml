# 开发环境。把下面各项改成你的实际值，或保持 ${VAR} 不改、把值写到仓库根目录 .env.dev
# 启动：kean/run.ps1    或    kean/run.ps1 -Profile dev

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kean_dev}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.trust: ${MAIL_HOST:smtp.qq.com}

logging:
  level:
    com.kean: debug

kean:
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:系统管理员}
  sms:
    expose-code: ${SMS_EXPOSE_CODE:false}
    allow-console: ${SMS_ALLOW_CONSOLE:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:课安}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:kean}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:true}
    site-key: ${TURNSTILE_SITE_KEY:}
    secret: ${TURNSTILE_SECRET:}
  http:
    trusted-proxies: ${TRUSTED_PROXIES:}
