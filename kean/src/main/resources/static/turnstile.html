<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>真人验证</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f6f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1d2129;
    }
    .wrap {
      padding: 48px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0 0 24px;
      color: #86909c;
      font-size: 14px;
    }
    .err {
      color: #ef4444;
    }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script src="https://js.cdn.aliyun.dcloud.net.cn/dev/uni-app/uni.webview.1.5.2.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>课安</h1>
    <p id="hint">请完成真人验证</p>
    <div id="widget"></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var sitekey = params.get("sitekey") || "";
      var hint = document.getElementById("hint");
      if (!/^[0-9A-Za-z_-]{8,80}$/.test(sitekey)) {
        hint.className = "err";
        hint.textContent = "验证配置无效";
        return;
      }
      function notify(token) {
        try {
          if (window.uni && typeof uni.postMessage === "function") {
            uni.postMessage({ data: { token: token } });
          }
        } catch (e) {}
        try {
          if (window.wx && wx.miniProgram && typeof wx.miniProgram.postMessage === "function") {
            wx.miniProgram.postMessage({ data: { token: token } });
          }
        } catch (e) {}
        setTimeout(function () {
          try {
            if (window.uni && typeof uni.navigateBack === "function") {
              uni.navigateBack();
              return;
            }
          } catch (e) {}
          try {
            if (window.wx && wx.miniProgram && typeof wx.miniProgram.navigateBack === "function") {
              wx.miniProgram.navigateBack();
            }
          } catch (e) {}
        }, 350);
      }
      function render() {
        if (!window.turnstile) {
          hint.className = "err";
          hint.textContent = "验证组件加载失败";
          return;
        }
        turnstile.render("#widget", {
          sitekey: sitekey,
          appearance: "always",
          callback: notify,
          "expired-callback": function () {},
          "error-callback": function () {
            hint.className = "err";
            hint.textContent = "验证失败，请重试";
          }
        });
      }
      if (window.turnstile) {
        render();
      } else {
        window.addEventListener("load", render);
      }
    })();
  </script>
</body>
</html>
